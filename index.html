    :root {
      --bg-0: #07040f;
      --bg-1: #0e0821;
      --magenta: #ff2ec4;
      --cyan: #20e6ff;
      --gold: #ffd23f;
      --gold-deep: #b8860b;
      --lose-red: #ff3860;
      --text-dim: #a79fc2
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      background: radial-gradient(ellipse at 50% 0%, var(--bg-1) 0%, var(--bg-0) 60%);
      color: #f1edff;
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: Rubik, sans-serif;
      overflow-x: hidden
    }

    .stage {
      z-index: 2;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 60px;
      display: flex;
      position: relative
    }

    h1.marquee {
      letter-spacing: 3px;
      text-align: center;
      color: #fff;
      text-shadow: 0 0 6px var(--magenta), 0 0 18px var(--magenta), 0 0 40px #ff2ec480;
      margin: 4px 0 2px;
      font-family: Orbitron, sans-serif;
      font-size: clamp(28px, 6vw, 46px);
      font-weight: 900
    }

    .subtitle {
      color: var(--text-dim);
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 22px;
      font-size: 13px
    }

    .topbar {
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      display: flex
    }

    .balance-panel {
      background: linear-gradient(#1a1030, #0c0818);
      border: 1px solid #20e6ff59;
      border-radius: 14px;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      display: flex;
      box-shadow: 0 0 20px #20e6ff26, inset 0 0 12px #20e6ff14
    }

    .balance-label {
      letter-spacing: 2px;
      color: var(--text-dim);
      font-size: 11px
    }

    .balance-value {
      color: var(--gold);
      text-shadow: 0 0 8px var(--gold), 0 0 20px #ffd23f99;
      min-width: 80px;
      font-family: Orbitron, sans-serif;
      font-size: 28px;
      font-weight: 700
    }

    .crip-icon {
      background: radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 55%, var(--gold-deep) 100%);
      width: 30px;
      height: 30px;
      box-shadow: 0 0 8px var(--gold);
      border-radius: 50%;
      flex: none;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      display: inline-flex
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      color: var(--cyan);
      cursor: pointer;
      background: linear-gradient(#1a1030, #0c0818);
      border: 1px solid #20e6ff59;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      transition: transform .15s, box-shadow .15s, color .15s, border-color .15s;
      display: flex;
      box-shadow: 0 0 12px #20e6ff26
    }

    .icon-btn:hover {
      transform: translateY(-2px)
    }

    .icon-btn.muted {
      color: var(--lose-red);
      border-color: #ff386080
    }

    .shop-open-btn {
      letter-spacing: 1px;
      border: 1px solid var(--gold);
      color: var(--gold);
      cursor: pointer;
      background: #ffd23f14;
      border-radius: 22px;
      padding: 10px 18px;
      font-family: Orbitron, sans-serif;
      font-size: 12px;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 0 10px #ffd23f40
    }

    .shop-open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 16px #ffd23f66
    }

    .arena {
      justify-content: center;
      align-items: center;
      gap: clamp(4px, 2.6vw, 22px);
      width: 100%;
      margin: 4px 0 10px;
      display: flex
    }

    .wheel-wrap {
      filter: drop-shadow(0 0 30px #ff2ec440);
      flex: none;
      width: min(340px, 64vw);
      height: min(340px, 64vw);
      position: relative
    }

    @keyframes wheelShake {
      0% {
        transform: translate(0)
      }

      15% {
        transform: translate(-4px, 2px)
      }

      30% {
        transform: translate(4px, -2px)
      }

      45% {
        transform: translate(-3px, 1px)
      }

      60% {
        transform: translate(3px, -1px)
      }

      75% {
        transform: translate(-2px, 1px)
      }

      90% {
        transform: translate(2px)
      }

      to {
        transform: translate(0)
      }
    }

    .wheel-wrap.shake {
      animation: .32s wheelShake
    }

    .pointer {
      border-left: 14px solid #0000;
      border-right: 14px solid #0000;
      border-top: 24px solid var(--cyan);
      width: 0;
      height: 0;
      filter: drop-shadow(0 0 8px var(--cyan));
      z-index: 5;
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translate(-50%)
    }

    .wheel {
      will-change: transform;
      border: 6px solid #1c1233;
      border-radius: 50%;
      width: 100%;
      height: 100%;
      transition: transform 3.6s cubic-bezier(.14, .83, .09, 1);
      position: relative;
      box-shadow: 0 0 0 3px #ff2ec480, 0 0 40px #20e6ff40, inset 0 0 30px #0009
    }

    .sector-label {
      pointer-events: none;
      justify-content: center;
      align-items: center;
      width: 0;
      height: 0;
      display: flex;
      position: absolute;
      top: 50%;
      left: 50%
    }

    .hub {
      border: 2px solid var(--magenta);
      width: 22%;
      height: 22%;
      box-shadow: 0 0 16px var(--magenta), inset 0 0 10px #000000b3;
      z-index: 4;
      background: radial-gradient(circle at 35% 30%, #241a3d, #0a0616 75%);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      display: flex;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%)
    }

    .hub-mark {
      letter-spacing: 1px;
      color: var(--cyan);
      text-shadow: 0 0 6px var(--cyan);
      font-family: Orbitron, sans-serif;
      font-size: 15px
    }

    .skeleton-guard {
      aspect-ratio: 120/480;
      pointer-events: none;
      transform-origin: bottom;
      flex: none;
      align-self: center;
      width: clamp(46px, 15vw, 118px);
      animation: 6.5s ease-in-out infinite alternate skeleSway
    }

    .skeleton-right {
      animation-delay: -3.2s;
      position: relative
    }

    .skeleton-left {
      position: relative
    }

    @keyframes skeleSway {
      0% {
        transform: rotate(-.6deg)
      }

      to {
        transform: rotate(.6deg)
      }
    }

    .skele-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 2px var(--cyan)) drop-shadow(0 0 7px #20e6ff8c) drop-shadow(0 1px 3px #0009);
      display: block
    }

    .skele-svg .jaw {
      transform-box: fill-box;
      transform-origin: top;
      transition: transform .35s cubic-bezier(.34, 1.2, .64, 1)
    }

    .skeleton-guard.jaw-open .jaw {
      transform: translateY(7px)rotate(5deg)
    }

    .skeleton-right.jaw-open .jaw {
      transform: translateY(7px)rotate(-5deg)
    }

    .skele-bubble {
      border: 1px solid var(--cyan);
      color: #f1edff;
      text-align: center;
      opacity: 0;
      z-index: 3;
      background: linear-gradient(#1a1030, #0c0818);
      border-radius: 12px;
      width: max-content;
      max-width: 120px;
      padding: 6px 9px;
      font-size: 10.5px;
      line-height: 1.3;
      transition: opacity .3s, transform .3s;
      position: absolute;
      top: 6%;
      transform: translateY(6px)scale(.9);
      box-shadow: 0 0 14px #20e6ff66
    }

    .skeleton-left .skele-bubble {
      margin-left: 6px;
      left: 100%
    }

    .skeleton-right .skele-bubble {
      margin-right: 6px;
      right: 100%
    }

    .skele-bubble.show {
      opacity: 1;
      transform: translateY(0)scale(1)
    }

    .result-line {
      letter-spacing: 1px;

      min-height: 22px;
      margin-bottom: 8px;
      font-family: Orbitron, sans-serif;

      color: var(--gold);
      text-shadow: 0 0 10px var(--gold)
    }

    .result-line.lose {

      text-shadow: 0 0 8px var(--lose-red)
    }

      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      display: flex
    }

    .bet-label {
      letter-spacing: 2px;
      color: var(--text-dim);
      font-size: 11px
    }

    .bet-input-row {
      justify-content: center;
      align-items: center;
      gap: 10px;
      display: flex
    }

    .bet-deco {

      align-items: center;
      gap: 4px;
      display: flex
    }

    .deco-coin {

      width: 16px;
      height: 16px;
      box-shadow: 0 0 6px var(--gold);
      border-radius: 50%

    .deco-bill {
      background: linear-gradient(135deg, #2f5d3a, #1d3823);
      border: 1px solid #ffd23f99;
      border-radius: 3px;
      width: 26px;
      height: 15px;
      position: relative
    }

    .deco-bill:after {
      content: "";
      border: 1px dashed #ffd23f80;
      border-radius: 2px;
      position: absolute;
      top: 2.5px;
      right: 2.5px;
      bottom: 2.5px;
      left: 2.5px
    }

    .bet-input {
      text-align: center;
      width: 120px;
      color: var(--gold);
      background: linear-gradient(#1a1030, #0c0818);
      border: 2px solid #ffd23f80;
      border-radius: 12px;
      padding: 8px 6px;
      font-family: Orbitron, sans-serif;
      font-size: 20px;
      font-weight: 700;
      box-shadow: inset 0 0 10px #ffd23f26
    }

    .bet-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold);
      outline: none
    }

    .bet-input:disabled {
      opacity: .5
    }

    .bet-hint {
      color: var(--text-dim);
      letter-spacing: .5px;
      font-size: 11px
    }

    .chips {
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      display: flex
    }

    .chip {
      color: #dcd6ff;
      cursor: pointer;
      background: radial-gradient(circle at 35% 30%, #2c1f4d, #150c2a 75%);
      border: 2px dashed #20e6ff80;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-family: Orbitron, sans-serif;
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s, box-shadow .15s, border-color .15s
    }

    .chip:hover {
      transform: translateY(-2px)
    }

    .chip.selected {
      border: 2px solid var(--gold);
      box-shadow: 0 0 14px var(--gold);
      color: var(--gold);
      border-style: solid
    }

    .chip:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none
    }

    .spin-btn {
      letter-spacing: 2px;
      cursor: pointer;
      color: #1a0a1e;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      border: none;
      border-radius: 40px;
      padding: 16px 52px;
      font-family: Orbitron, sans-serif;
      font-size: 19px;
      font-weight: 900;
      transition: transform .12s, filter .12s;
      box-shadow: 0 0 22px #ff2ec480, 0 0 22px #20e6ff59
    }

    .spin-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px)
    }

    .spin-btn:disabled {
      color: #6a6285;
      box-shadow: none;
      cursor: not-allowed;
      background: #2a2440;
      transform: none
    }

    .odds-note {
      color: var(--text-dim);
      letter-spacing: .5px;
      text-align: center;
      max-width: 320px;
      font-size: 11px
    }

    .overlay {
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      background: #04020aeb;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 20px;
      transition: opacity .3s;
      display: flex;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto
    }

    .overlay h2 {
      color: var(--lose-red);
      text-shadow: 0 0 16px var(--lose-red);
      letter-spacing: 2px;
      margin: 0;
      font-family: Orbitron, sans-serif;
      font-size: 26px
    }

    .overlay p {
      color: var(--text-dim);
      text-align: center;
      max-width: 320px;
      margin: 0
    }

    .modal {
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      background: #04020ae6;
      justify-content: center;
      align-items: center;
      padding: 16px;
      transition: opacity .25s;
      display: flex;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto
    }

    .modal-box {
      background: linear-gradient(#1a1030, #0c0818);
      border: 1px solid #20e6ff66;
      border-radius: 18px;
      width: 100%;
      max-width: 540px;
      max-height: 86vh;
      padding: 18px;
      overflow-y: auto;
      box-shadow: 0 0 30px #20e6ff33
    }

    .modal-header {
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      display: flex
    }

    .modal-header h3 {
      letter-spacing: 1px;
      color: #fff;
      margin: 0;
      font-family: Orbitron, sans-serif;
      font-size: 16px
    }

    .modal-close {
      color: var(--text-dim);
      cursor: pointer;
      background: 0 0;
      border: none;
      font-size: 20px;
      line-height: 1
    }

    .modal-close:hover {
      color: #fff
    }

    .shop-balance {
      text-align: center;
      color: var(--gold);
      margin-bottom: 14px;
      font-family: Orbitron, sans-serif;
      font-size: 14px
    }

    .shop-tabs {
      gap: 8px;
      margin-bottom: 14px;
      display: flex
    }

    .shop-tab {
      color: var(--text-dim);
      letter-spacing: 1px;
      cursor: pointer;
      background: 0 0;
      border: 1px solid #20e6ff4d;
      border-radius: 10px;
      flex: 1;
      padding: 9px 6px;
      font-family: Orbitron, sans-serif;
      font-size: 11px
    }

    .shop-tab.active {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px #20e6ff4d
    }

    .shop-slot {
      margin-bottom: 16px
    }

    .shop-slot-title {
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-size: 11px
    }

    .shop-items {
      flex-wrap: wrap;
      gap: 8px;
      display: flex
    }

    .shop-item {
      text-align: center;
      background: #ffffff05;
      border: 1px solid #20e6ff40;
      border-radius: 10px;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 92px;
      padding: 8px 6px;
      font-size: 11px;
      display: flex
    }

    .shop-item .item-name {
      color: #f1edff;
      min-height: 26px
    }

    .shop-item .item-price {
      color: var(--gold);
      font-family: Orbitron, sans-serif;
      font-size: 12px
    }

    .shop-item button {
      letter-spacing: .5px;
      cursor: pointer;
      border: none;
      border-radius: 14px;
      width: 100%;
      margin-top: 2px;
      padding: 6px 8px;
      font-family: Orbitron, sans-serif;
      font-size: 10px
    }

    .shop-item button.buy {
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      color: #1a0a1e
    }

    .shop-item button.equip {
      color: var(--cyan);
      border: 1px solid var(--cyan);
      background: #20e6ff26
    }

    .shop-item button.equipped {
      color: var(--gold);
      border: 1px solid var(--gold);
      background: #ffd23f33
    }

    .shop-item button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .mg-section-title {
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-top: 6px;
      font-family: Orbitron, sans-serif;
      font-size: 12px
    }

    .mg-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 360px;
      display: grid
    }

    .mg-card {
      color: #f1edff;
      cursor: pointer;
      text-align: center;
      background: #20e6ff0f;
      border: 1px solid #20e6ff4d;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 11px;
      transition: border-color .15s, box-shadow .15s
    }

    .mg-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 10px #20e6ff4d
    }

    .mg-reward {
      color: var(--gold);
      margin-top: 4px;
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      display: block
    }

    .mg-body {
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
      display: flex
    }

    .mg-btn {
      border: 2px solid var(--cyan);
      color: var(--cyan);
      cursor: pointer;
      background: #20e6ff14;
      border-radius: 14px;
      padding: 12px 24px;
      font-family: Orbitron, sans-serif;
      font-size: 14px;
      font-weight: 700
    }

    .mg-btn:hover {
      box-shadow: 0 0 14px var(--cyan)
    }

    .mg-btn.go {
      border-color: var(--gold);
      color: var(--gold);
      background: #ffd23f1a
    }

    .mg-status {
      text-align: center;
      min-height: 20px;
      color: var(--text-dim);
      font-size: 13px
    }

    .mg-tiles {
      grid-template-columns: repeat(2, 70px);
      gap: 10px;
      display: grid
    }

    .mg-tile {
      cursor: pointer;
      opacity: .45;
      border: none;
      border-radius: 10px;
      width: 70px;
      height: 70px;
      transition: opacity .15s, transform .1s
    }

    .mg-tile.flash {
      opacity: 1;
      transform: scale(1.05)
    }

    .mg-choices {
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      display: flex
    }

    .mg-choice-btn {
      color: #f1edff;
      cursor: pointer;
      background: #ffffff08;
      border: 1px solid #20e6ff66;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: Orbitron, sans-serif;
      font-size: 13px
    }

    .mg-choice-btn:hover {
      border-color: var(--cyan)
    }

    .mg-catch-area {
      border: 1px dashed #20e6ff4d;
      border-radius: 12px;
      width: 100%;
      max-width: 280px;
      height: 180px;
      position: relative;
      overflow: hidden
    }

    .mg-coin-target {
      background: radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 55%, var(--gold-deep) 100%);
      width: 50px;
      height: 50px;
      box-shadow: 0 0 12px var(--gold);
      cursor: pointer;
      border: none;
      border-radius: 50%;
      transition: left .28s linear, top .28s linear;
      position: absolute
    }

    .podium {
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin: 6px 0 22px;
      display: flex
    }

    .podium-col {
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 92px;
      display: flex
    }

    .podium-avatar {
      border: 2px solid var(--cyan);
      background: radial-gradient(circle at 35% 30%, #241a3d, #0a0616 75%);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      font-size: 20px;
      display: flex;
      box-shadow: 0 0 10px #20e6ff66
    }

    .podium-col.me .podium-avatar {
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold)
    }

    .podium-name {
      color: #f1edff;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 88px;
      font-size: 11px;
      overflow: hidden
    }

    .podium-col.me .podium-name {
      color: var(--gold)
    }

    .podium-score {
      color: var(--gold);
      font-family: Orbitron, sans-serif;
      font-size: 12px
    }

    .podium-step {
      color: #1a0a1e;
      border-radius: 8px 8px 0 0;
      justify-content: center;
      align-items: flex-start;
      width: 88px;
      padding-top: 6px;
      font-family: Orbitron, sans-serif;
      font-size: 20px;
      font-weight: 900;
      display: flex
    }

    .podium-step.first {
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      height: 92px
    }

    .podium-step.second {
      background: linear-gradient(#c7d1e0, #8b93a3);
      height: 66px
    }

    .podium-step.third {
      background: linear-gradient(#d9945a, #8a5a34);
      height: 48px
    }

    .leader-list {
      flex-direction: column;
      gap: 6px;
      display: flex
    }

    .leader-row {
      color: #dcd6ff;
      background: #ffffff05;
      border: 1px solid #ffffff0d;
      border-radius: 8px;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      display: flex
    }

    .leader-row.me {
      border: 1px solid var(--gold);
      color: var(--gold);
      background: #ffd23f1a;
      font-weight: 700
    }

    .leader-rank {
      opacity: .7;
      width: 20px;
      font-family: Orbitron, sans-serif
    }

    .leader-name {
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      overflow: hidden
    }

    .leader-score {
      color: var(--gold);
      font-family: Orbitron, sans-serif
    }

    .yak-banner {
      border: 2px solid var(--gold);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(#241a3d, #150c2a);
      border-radius: 16px;
      align-items: center;
      gap: 12px;
      max-width: 90vw;
      padding: 14px 22px;
      transition: opacity .35s, transform .35s;
      display: flex;
      position: fixed;
      top: 14%;
      left: 50%;
      transform: translate(-50%, -20px);
      box-shadow: 0 0 26px #ffd23f8c, inset 0 0 14px #ffd23f1f
    }

    .yak-banner.show {
      opacity: 1;
      transform: translate(-50%)
    }

    .yak-avatar {
      background: radial-gradient(circle at 35% 30%, #3a2b00, var(--gold-deep) 70%);
      width: 46px;
      height: 46px;
      box-shadow: 0 0 10px var(--gold);
      border-radius: 50%;
      flex: none;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      display: flex
    }

    .yak-text {
      flex-direction: column;
      gap: 2px;
      display: flex
    }

    .yak-name {
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 0 8px var(--gold);
      font-family: Orbitron, sans-serif;
      font-size: 13px;
      font-weight: 900
    }

    .yak-phrase {
      color: #f1edff;
      letter-spacing: .3px;
      font-size: 14px
    }

    .coin-layer {
      pointer-events: none;
      z-index: 40;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden
    }

    .coin {
      background: radial-gradient(circle at 35% 30%, #fff8dc, var(--gold) 55%, var(--gold-deep) 100%);
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      animation-name: fall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      display: flex;
      position: absolute;
      top: -60px;
      box-shadow: 0 0 10px #ffd23fcc, inset 0 0 4px #fff9
    }

    .coin svg {
      filter: drop-shadow(0 0 1px #000000e6);
      width: 62%;
      height: 62%
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translateY(0)rotate(0)
      }

      to {
        opacity: .9;
        transform: translateY(110vh)rotate(540deg)
      }
    }

    @media(max-width:480px) {
      .wheel-wrap {
        width: min(300px, 58vw);
        height: min(300px, 58vw)
      }

      .skeleton-guard {
        width: clamp(38px, 13vw, 80px)
      }

      .skele-bubble {
        max-width: 90px;
        padding: 5px 7px;
        font-size: 9px
      }

      .mg-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:360px) {
      .chip {
        width: 50px;
        height: 50px;
        font-size: 13px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .wheel {
        transition: transform .6s linear
      }

      .coin {
        animation-duration: .6s !important
      }

      .skeleton-guard,
      .wheel-wrap.shake {
        animation: none
      }
    }

    .nav-badge {
      color: #fff;
      background: #f05;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      width: 16px;
      height: 16px;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      position: absolute;
      top: -4px;
      right: -4px;
      box-shadow: 0 0 8px #f05
    }

    .booster-active-tag {
      letter-spacing: .5px;
      border-radius: 9999px;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex
    }

    .char-speech-caption {
      color: #ffbbf0;
      text-align: center;
      background: #0a0814d9;
      border: 1px solid #ff2ec480;
      border-radius: 12px;
      max-width: 320px;
      margin: 4px auto;
      padding: 5px 12px;
      font-size: 12px;
      font-style: italic;
      animation: .2s ease-out fadeIn;
      box-shadow: 0 0 12px #ff2ec440
